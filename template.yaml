AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SIS 3 - order processing (SNS -> SQS -> Lambda -> DynamoDB, DLQ) and a container
  service (ECR + ECS Fargate behind ALB) in one reproducible stack.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Selects log retention and number of tasks
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: CommaDelimitedList
    Description: At least two public subnets in different AZs
  ImageTag:
    Type: String
    Default: ""
    Description: Immutable image tag in ECR. Empty = bootstrap run with 0 tasks

Mappings:
  EnvConfig:
    dev:     { LogRetention: 7,  DesiredCount: 1 }
    staging: { LogRetention: 14, DesiredCount: 2 }
    prod:    { LogRetention: 30, DesiredCount: 2 }

Conditions:
  HasImage: !Not [!Equals [!Ref ImageTag, ""]]

Resources:
  # ---------- Messaging (week 9) ----------
  OrdersDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60            # 6 x Lambda timeout (10 s)
      ReceiveMessageWaitTimeSeconds: 20
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDlq.Arn
        maxReceiveCount: 5

  OrdersTopic:
    Type: AWS::SNS::Topic

  OrdersQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref OrdersQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt OrdersQueue.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !Ref OrdersTopic }

  OrdersSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrdersTopic
      Protocol: sqs
      Endpoint: !GetAtt OrdersQueue.Arn
      RawMessageDelivery: true

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: orderId, AttributeType: S }
      KeySchema:
        - { AttributeName: orderId, KeyType: HASH }

  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-consumer
      RetentionInDays: !FindInMap [EnvConfig, !Ref Environment, LogRetention]

  ConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: consumer-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt OrdersQueue.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt OrdersTable.Arn

  ConsumerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ConsumerLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-consumer
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ConsumerRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Code:
        ZipFile: |
          import json, os, logging
          from decimal import Decimal
          import boto3
          from botocore.exceptions import ClientError

          log = logging.getLogger()
          log.setLevel(logging.INFO)
          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])

          def validate(o):
              if not isinstance(o.get("orderId"), str) or not o["orderId"]:
                  raise ValueError("orderId missing")
              a = o.get("amount")
              if isinstance(a, bool) or not isinstance(a, (int, float)) or a <= 0:
                  raise ValueError("invalid amount")

          def handler(event, context):
              failures = []
              for r in event["Records"]:
                  mid = r["messageId"]
                  try:
                      order = json.loads(r["body"])
                      validate(order)
                      # dedup key = orderId: conditional write makes the consumer idempotent
                      table.put_item(
                          Item={"orderId": order["orderId"],
                                "amount": Decimal(str(order["amount"])),
                                "status": "PROCESSED"},
                          ConditionExpression="attribute_not_exists(orderId)")
                      log.info(json.dumps({"event": "processed", "orderId": order["orderId"], "messageId": mid}))
                  except ClientError as e:
                      if e.response["Error"]["Code"] == "ConditionalCheckFailedException":
                          log.info(json.dumps({"event": "duplicate_skipped", "orderId": order["orderId"], "messageId": mid}))
                      else:
                          log.error(json.dumps({"event": "failed", "messageId": mid, "error": str(e)}))
                          failures.append({"itemIdentifier": mid})
                  except Exception as e:
                      log.error(json.dumps({"event": "failed", "messageId": mid, "error": str(e)}))
                      failures.append({"itemIdentifier": mid})
              return {"batchItemFailures": failures}

  ConsumerTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt OrdersQueue.Arn
      FunctionName: !Ref ConsumerFunction
      BatchSize: 10
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig: { MaximumConcurrency: 2 }

  # ---------- Container (week 10) ----------
  Repo:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EmptyOnDelete: true              # so delete-stack works with images inside
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep last 10 images",
           "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
           "action":{"type":"expire"}}]}

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: !FindInMap [EnvConfig, !Ref Environment, LogRetention]

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB, HTTP from the internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Tasks, 8080 only from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurityGroup }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref TargetGroup }

  Cluster:
    Type: AWS::ECS::Cluster

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: publish-orders
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref OrdersTopic

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-task
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !If
            - HasImage
            - !Sub "${Repo.RepositoryUri}:${ImageTag}"
            - !Sub "${Repo.RepositoryUri}:bootstrap"
          Essential: true
          PortMappings: [{ ContainerPort: 8080 }]
          Environment:
            - { Name: TOPIC_ARN, Value: !Ref OrdersTopic }
            - { Name: AWS_DEFAULT_REGION, Value: !Ref "AWS::Region" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ecs

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !If [HasImage, !FindInMap [EnvConfig, !Ref Environment, DesiredCount], 0]
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - { ContainerName: app, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup }

Outputs:
  ServiceUrl:
    Value: !Sub http://${LoadBalancer.DNSName}
  RepositoryUri:
    Value: !GetAtt Repo.RepositoryUri
  TopicArn:
    Value: !Ref OrdersTopic
  QueueUrl:
    Value: !Ref OrdersQueue
  DlqUrl:
    Value: !Ref OrdersDlq
  TableName:
    Value: !Ref OrdersTable
